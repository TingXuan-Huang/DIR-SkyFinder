# Single source of truth for all analysis-pipeline paths and reference constants.
# Loaded once by `analysis.py` (and `inference.py`) and passed as `config` into
# every function in `analysis/*.py`. No module reads these constants directly --
# this keeps `analysis/` independent of `dir_skyfinder/baseline.py` module globals.
#
# Code-level things (EVAL_TF, make_model, FDSModel, FDS, per_bin_mae, get_device)
# are still imported from `dir_skyfinder.baseline` -- those are reusable code,
# not configuration.

# --- Data paths ---
labels_path:  data/labels_with_images.csv
splits_path:  data/splits/loco_5fold.json
img_dir:      data/images
masks_dir:    data/masks

# --- Output directories ---
results_dir:           results
ablation_results_dir:  ablations/results
figures_dir:           figures
embeddings_dir:        ablations/results/embeddings
trajectory_dir:        ablations/results/embeddings/trajectory

# --- Aggregated / shared output files ---
test_inference_path:   results/test_inference.json
aggregate_csv:         ablations/results/aggregate.csv
c1_results_path:       ablations/results/c1_constants.json
c2_results_path:       ablations/results/c2_metadata_only.json
d1_results_path:       ablations/results/d1_skymask.json

# --- aggregate.py scopes ---
aggregate_result_dirs:
  - results
  - ablations/results
ablation_yamls:
  - ablations/config_ab.yaml
  - ablations/config_ab2.yaml

# --- Temperature range (used by FDS bucket reconstruction in d1.py / inference) ---
min_temp:           -30.0
max_temp:            55.0
default_bin_width:    1.0
